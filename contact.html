<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>

  <link rel="stylesheet" href="stylemain.css" />
  <link rel="stylesheet" href="mouse.css" />
  <link rel="stylesheet" href="stylecontact.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <header>
    <div id="navbar"></div>
  </header>

  <div class="blob"></div>

  <main class="contact-main d-flex flex-column justify-content-center align-items-center">
    <h1 class="contact-title">Let’s Work Together!</h1>
    <p class="contact-desc">
      If you'd like to learn more about my work or get in touch, feel free to reach out – I’d love to hear from you!
    </p>
    <form id="contactForm" class="w-100" style="max-width:400px;" method="POST">
      <div class="mb-3">
        <label for="name" class="form-label">Name*</label>
        <input type="text" class="form-control" id="name" name="name" required />
      </div>
      <div class="mb-3">
        <label for="subject" class="form-label">Subject*</label>
        <input type="text" class="form-control" id="subject" name="subject" required />
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">Message*</label>
        <textarea class="form-control" id="message" name="message" rows="4" maxlength="650" required></textarea>
      </div>
      <!-- I'm not a robot checkbox -->
      <div class="form-check mb-3 d-flex flex-row gap-2 w-100">
        <input class="form-check-input" type="checkbox" value="" id="notRobot" required style="display:none;">
        <button type="button" id="robotBtn" class="btn btn-outline-secondary flex-fill w-100" style="display:flex;align-items:center;gap:0.5rem;">
          <span id="robotBtnIcon"><i class="fa-regular fa-circle"></i></span>
          <span>I'm not a robot</span>
        </button>
        <button type="submit" class="btn btn-dark flex-fill w-100">Send</button>
      </div>
      <div id="formStatus" class="mt-3 text-center"></div>
    </form>
  </main>

  <footer class="bg-light">
    <div id="footer"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scriptabout.js"></script>
  <script src="script.js" type="module" defer></script>
  <script src="js/main.js"></script>
  <script>
document.getElementById('contactForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const status = document.getElementById('formStatus');
  const name = document.getElementById('name').value.trim();
  const subject = document.getElementById('subject').value.trim();
  const message = document.getElementById('message').value.trim();
  const notRobot = document.getElementById('notRobot').checked;

  if (!name || !subject || !message || !notRobot) {
    status.textContent = "Please fill out all fields and confirm you are not a robot.";
    status.className = "mt-3 text-center text-danger";
    return false;
  }
  if (message.length > 650) {
    status.textContent = "Message must be 650 characters or less.";
    status.className = "mt-3 text-center text-danger";
    return false;
  }

  status.textContent = "Sending...";
  status.className = "mt-3 text-center text-secondary";

  // Replace with your Formspree endpoint
  const endpoint = "https://formspree.io/f/mgvykppw";
  const data = { name, subject, message };

  try {
    const response = await fetch(endpoint, {
      method: "POST",
      headers: {
        "Accept": "application/json",
        "Content-Type": "application/json"
      },
      body: JSON.stringify(data)
    });
    if (response.ok) {
      status.textContent = "Thank you! Your message has been sent.";
      status.className = "mt-3 text-center text-success";
      document.getElementById('contactForm').reset();
    } else {
      status.textContent = "There was an error sending your message. Please try again later.";
      status.className = "mt-3 text-center text-danger";
    }
  } catch (err) {
    status.textContent = "There was an error sending your message. Please try again later.";
    status.className = "mt-3 text-center text-danger";
  }
});

const robotBtn = document.getElementById('robotBtn');
const robotBtnIcon = document.getElementById('robotBtnIcon');
const notRobot = document.getElementById('notRobot');

robotBtn.addEventListener('click', function() {
  notRobot.checked = !notRobot.checked;
  if (notRobot.checked) {
    robotBtn.classList.remove('btn-outline-secondary');
    robotBtn.classList.add('btn-success');
    robotBtnIcon.innerHTML = '<i class="fa-solid fa-circle-check"></i>';
  } else {
    robotBtn.classList.remove('btn-success');
    robotBtn.classList.add('btn-outline-secondary');
    robotBtnIcon.innerHTML = '<i class="fa-regular fa-circle"></i>';
  }
});
  </script>
</body>
</html>
