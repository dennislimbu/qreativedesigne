<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QreativeDesign</title>

  <link rel="stylesheet" href="stylemain.css" />
  <link rel="stylesheet" href="styleabout.css" />
  <link rel="stylesheet" href="mouse.css" />

  <script src="script.js" type="module" defer></script>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Font Awesome CDN: Place this in the head! -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body style="min-height: 100vh; height: 100vh;">
  <div class="blob"></div>

  <!-- Nav Bar -->
 <header>
    <div id="navbar"></div>
  </header>

  <!-- Main -->

  <main class="container about-section d-flex">
    <div class="aboutMe flex-fill sticky-note" style="position:relative;">
      <div class="pushpin tilted" style="position:absolute; top:-32px; left:20%; transform:translateX(-50%) rotate(9deg); z-index:20;">
        <div class="pinhead"></div>
        <div class="pinbase"></div>
        <div class="pinshaft"></div>
        <div class="pinpoint"></div>
      </div>
      <h1 class="aboutMeTitle">About Me</h1>
      <p class="aboutMeText">
        Hi, I’m Quynh-Nhu!<br><br>
        A creative passionate graphic designer who has a love for visual storytelling, that brings ideas to life.
      </p>
      <p>
        <a href="mailto:qreativedesigner@gmail.com" style="color: #000; text-decoration: underline;">
          qreativedesigner@gmail.com
        </a>
      </p>      
    </div>
  <!-- IMG Grid for desktop/tablet -->
    <div class="images-grid flex-fill" style="margin-left: -10px;">
      <div class="img1">
        <div id="polaroid">
          <div class="red-sticker">★</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Kiki.JPG" alt="Kiki" 
                style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div id="polaroid-text">Kiki</div>
        </div>
      </div>
      <div class="img2">
        <div id="polaroid">
          <div class="red-sticker">!</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Me.jpg" alt="Polaroid 2" 
            style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div id="polaroid-text">Me</div>
        </div>
      </div>
      <div class="img3">
        <div id="polaroid">
          <div class="red-sticker">♥</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Iced-Milo-Mocha.jpg" alt="Iced-Milo-Mocha" 
              style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div id="polaroid-text">Iced Milo Mocha</div>
        </div>
      </div>
      <div class="img4">
        <div id="polaroid">
          <div class="red-sticker">✦</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Dreamscape.jpg" alt="Korea" 
              style="width:100%; height:100%; object-fit:cover;">
          </div>
          <div id="polaroid-text">Korea</div>
        </div>
      </div>
    </div>

  <!-- IMG Grid for mobile only -->
  <!-- Polaroid stack for mobile only -->
    <div class="images-stack-mobile" style="display:none;">
      <div class="polaroid-stack">
        <div class="polaroid-item active">
          <div class="red-sticker">★</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Kiki.JPG" alt="Kiki" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </div>
          <div id="polaroid-text">Kiki</div>
        </div>
        <div class="polaroid-item">
          <div class="red-sticker">!</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Me.jpg" alt="Me" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </div>
          <div id="polaroid-text">Me</div>
        </div>
        <div class="polaroid-item">
          <div class="red-sticker">♥</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Iced-Milo-Mocha.jpg" alt="Iced Milo Mocha" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </div>
          <div id="polaroid-text">Iced Milo Mocha</div>
        </div>
        <div class="polaroid-item">
          <div class="red-sticker">✦</div>
          <div id="image-bg">
            <img src="img/About Me Pictures/Dreamscape.jpg" alt="Korea" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
          </div>
          <div id="polaroid-text">Korea</div>
        </div>
      </div>
    </div>
  </main>

      <!-- Footer -->
  <footer class="bg-light">
    <div id="footer"></div>
  </footer>

      <!-- Font Awesome CDN -->
       
      <script src="scriptabout.js"></script>
      <script src="js/main.js"></script>
    </body>
</html>
