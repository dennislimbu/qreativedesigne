<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QreativeDesign</title>
  <link rel="stylesheet" href="stylemain.css" />
  <link rel="stylesheet" href="mouse.css" />
  <link rel="stylesheet" href="styleabout.css" />
  <link rel="stylesheet" href="styleindex.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <!-- Nav Bar -->
  <header>
    <div id="navbar"></div>
  </header>

  <!-- Hero Section -->
  <div class="blob"></div>

  <main class="container position-relative">
    <!-- Decorative Stickers -->
    <img src="img/Homepage-Stickers/BowRed.png" alt="Bow Red" class="sticker-bow-red">
    <img src="img/Homepage-Stickers/bow.png" alt="Bow" class="sticker-bow">
    <img src="img/Homepage-Stickers/Miffy.png" alt="Miffy" class="sticker-miffy">

    <!-- Top left polaroid -->
    <div class="polaroid-item top-left active">
      <div class="red-sticker">★</div>
      <div id="image-bg">
        <img src="img/Homescreen Images/2022-12-20 18_57_13.163.JPG" alt="Kiki" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
      </div>
    </div>

    <h1 style="font-weight: 700; position: relative; z-index: 1;">
      Hi, I am Quynh-Nhu <br> Welcome to my portfolio!
    </h1>

    <!-- Bottom right polaroid -->
    <div class="polaroid-item bottom-right active">
      <div class="red-sticker">★</div>
      <div id="image-bg" style="position:relative;">
        <img src="img/Homescreen Images/IMG_1413.jpg" alt="Kiki" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
        <img src="img/Homepage-Stickers/Stamp.png" alt="Stamp" class="sticker-stamp">
      </div>
    </div>
  </main>

  <!-- Footer Section -->
  <footer class="bg-light">
    <div id="footer"></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="scriptabout.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
