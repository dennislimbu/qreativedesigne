<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QreativeDesign</title>
  <link rel="stylesheet" href="../../stylemain.css" />
  <link rel="stylesheet" href="../../styleproject.css" />
  <link rel="stylesheet" href="../../Style/Project1.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <script src="script.js" type="module" defer></script>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body style="min-height:100vh; display:flex; flex-direction:column;">
  <!-- Nav Bar -->
  <header>
    <div id="project-navbar"></div>
  </header>

  <main style="flex:1 0 auto;">
    <section class="container my-5">
      <!-- Top: Title and image side by side -->
      <div class="row align-items-center mb-5 justify-content-center">
        <div class="col-12" style="max-width:900px; margin:auto;">
          <h1 class="display-5 fw-bold pt-4 width-100 text-center"> 
            Motion Graphics | iAnna
          </h1>
        </div>
      </div>
      <!-- Video -->
      <div class="mb-5">
        <div class="d-flex justify-content-center">
          <video controls style="width:100%; max-width:900px; border-radius:1rem; background:#000;">
            <source src="../../img/iAnna _ Motion Graphics/iAnna animation.mp4" type="video/mp4">
            Your browser does not support the video tag.
          </video>
        </div>
      </div>
    </section>
  </main>

  <!-- Footer Section -->
<footer class="bg-light">
  <div id="project-footer"></div>
</footer>

  <script src="../../js/main.js"></script>
</body>
</body>
</html>
